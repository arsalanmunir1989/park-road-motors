<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Park Road Motors – Admin listings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>x-dc{display:none}</style>
<script src="assets/prm-runtime.js"></script>
</head>
<body>
<x-dc><template>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F5}
a{color:#8A6A1F;text-decoration:none}a:hover{color:#5E4710}
input,button,select{font:inherit}
@keyframes prmUp{from{opacity:0;transform:translate3d(0,32px,0)}to{opacity:1;transform:none}}
@keyframes prmDown{from{opacity:0;transform:translate3d(0,-100%,0)}to{opacity:1;transform:none}}
@keyframes prmFade{from{opacity:0}to{opacity:1}}
@keyframes prmKen{from{transform:scale(1.02)}to{transform:scale(1.14) translate3d(-1.5%,-1%,0)}}
@keyframes prmTurn{0%,100%{transform:perspective(1200px) rotateY(-12deg)}50%{transform:perspective(1200px) rotateY(12deg)}}
@keyframes prmSpin{to{transform:rotate(360deg)}}
@keyframes prmPulse{0%{transform:scale(.9);opacity:.75}100%{transform:scale(1.7);opacity:0}}
@keyframes prmShine{0%{transform:translate3d(-150%,0,0) skewX(-20deg)}55%,100%{transform:translate3d(380%,0,0) skewX(-20deg)}}
@keyframes prmDrift{0%{transform:scale(1.1) translate3d(-3%,0,0)}100%{transform:scale(1.16) translate3d(3%,-2%,0)}}
@keyframes prmMarquee{to{transform:translate3d(-50%,0,0)}}
@keyframes prmProgress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes prmFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-10px,0)}}
@keyframes prmGlow{0%,100%{opacity:.4}50%{opacity:.85}}
.prm-up{animation:prmUp .9s cubic-bezier(.2,.7,.2,1) both}
.prm-d1{animation-delay:.12s}.prm-d2{animation-delay:.26s}.prm-d3{animation-delay:.4s}.prm-d4{animation-delay:.55s}
.prm-down{animation:prmDown .8s cubic-bezier(.2,.7,.2,1) both}
.prm-swap{animation:prmFade .8s ease both}
.prm-reveal{animation:prmUp .9s cubic-bezier(.2,.7,.2,1) both}
@supports (animation-timeline:view()){.prm-reveal{animation-timeline:view();animation-range:entry 5% cover 25%}}
.prm-ken{position:absolute;inset:0;background:#0A0A0A url(assets/studio.jpg) center/cover no-repeat;animation:prmKen 14s ease-in-out infinite alternate;will-change:transform}
.prm-studio{background:#0A0A0A url(assets/studio.jpg) center/cover no-repeat}
.prm-trails{background:#0A0A0A url(assets/trails.jpg) center/cover no-repeat}
.prm-drift{position:absolute;inset:-8%;background:url(assets/trails.jpg) center/cover no-repeat;animation:prmDrift 26s ease-in-out infinite alternate;will-change:transform}
.prm-carbon{background-color:#0A0A0A;background-image:linear-gradient(180deg,rgba(10,10,10,.5),rgba(10,10,10,.82)),url(assets/carbon.png);background-size:auto,24px 24px}
.prm-pattern{background-color:#FFFFFF;background-image:url(assets/pattern.png);background-size:160px 160px}
.prm-pattern-ivory{background-color:#F7F6F2;background-image:url(assets/pattern.png);background-size:160px 160px}
.prm-turn{animation:prmTurn 9s ease-in-out infinite;transform-origin:50% 80%;will-change:transform}
.prm-float{animation:prmFloat 6s ease-in-out infinite}
.prm-ring{animation:prmSpin 30s linear infinite;transform-origin:50% 50%}
.prm-ring-rev{animation:prmSpin 46s linear infinite reverse;transform-origin:50% 50%}
.prm-glow{animation:prmGlow 4s ease-in-out infinite}
.prm-card{transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s,border-color .5s}
.prm-card:hover{transform:translate3d(0,-10px,0);box-shadow:0 28px 50px -18px rgba(0,0,0,.4);border-color:#D4AF61!important}
.prm-media{position:relative;overflow:hidden}
.prm-img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.prm-card:hover .prm-img{transform:scale(1.1) rotate(-2deg)}
.prm-media::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,236,190,.3),transparent);transform:translate3d(-150%,0,0) skewX(-20deg);pointer-events:none}
.prm-card:hover .prm-media::after{animation:prmShine 1.1s ease-out}
.prm-btn{position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s}
.prm-btn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translate3d(-150%,0,0) skewX(-20deg);animation:prmShine 3.8s ease-in-out infinite;pointer-events:none}
.prm-btn:hover{transform:translate3d(0,-2px,0);box-shadow:0 14px 26px -12px rgba(212,175,97,.8)}
.prm-ghost{transition:background-color .35s,color .35s,border-color .35s}
.prm-ghost:hover{background-color:#D4AF61!important;color:#0A0A0A!important;border-color:#D4AF61!important}
.prm-nav a{position:relative}
.prm-nav a::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:#D4AF61;transform:scaleX(0);transform-origin:right;transition:transform .45s}
.prm-nav a:hover::after{transform:scaleX(1);transform-origin:left}
@media (max-width:720px){.prm-nav{justify-content:center!important;padding:8px 12px!important;gap:0 18px!important}.prm-nav>a{order:-1;flex:1 0 100%!important}.prm-nav>a img{height:28px!important}.prm-nav>div{flex:0 0 auto!important;justify-content:center!important;gap:0 18px!important;font-size:11px}.prm-nav>div a{padding:8px 0!important}}
.prm-brand{transition:transform .45s,border-color .45s,box-shadow .45s}
.prm-brand:hover{transform:translate3d(0,-6px,0);border-color:#D4AF61!important;box-shadow:0 18px 30px -18px rgba(138,106,31,.6)}
.prm-brand:hover .prm-initial{animation:prmSpin 1s cubic-bezier(.2,.7,.2,1)}
.prm-marquee{display:flex;width:max-content;animation:prmMarquee 34s linear infinite}
.prm-marquee:hover{animation-play-state:paused}
.prm-progress{transform-origin:left;animation:prmProgress 6s linear both}
.prm-scrollbar{transform-origin:left;transform:scaleX(0)}
@supports (animation-timeline:scroll()){.prm-scrollbar{animation:prmProgress linear both;animation-timeline:scroll(root)}}
.prm-pulse{animation:prmPulse 2.2s ease-out infinite}
@media (hover:none){.prm-card:hover,.prm-brand:hover{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.prm-side a{transition:background-color .3s,color .3s,transform .3s}
.prm-side a:not([aria-current]):hover{background-color:rgba(212,175,97,.12);color:#D4AF61!important;transform:translate3d(4px,0,0)}
.prm-row{transition:background-color .25s}
.prm-row:hover{background-color:#FBF5E6}
.prm-tile{transition:transform .4s,box-shadow .4s}
.prm-tile:hover{transform:translate3d(0,-4px,0);box-shadow:0 16px 30px -18px rgba(0,0,0,.35)}
.prm-toast{animation:prmUp .5s cubic-bezier(.2,.7,.2,1) both}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1250px; background: #F5F5F5; color: #0A0A0A; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5">

<!-- SIDEBAR -->
<aside class="prm-carbon" style="flex: 1 1 248px; max-width: 100%; color: #FFFFFF; border-right: 2px solid #D4AF61; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<img src="assets/mark.png" alt="" style="height: 34px; width: auto">
<span style="font-family: Saira, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.05em; color: #D4AF61; line-height: 1.05">PARK ROAD<br>MOTORS</span>
</a>
<nav aria-label="Admin" class="prm-side" style="display: flex; flex-direction: column; gap: 2px; font-size: 14px; font-weight: 500">
<a href="admin-dashboard.html" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg>Dashboard</a>
<a href="admin-listings.html" aria-current="page" style="color: #0A0A0A; background: linear-gradient(135deg, #F0D78F 0%, #D4AF61 50%, #B8913E 100%); font-weight: 600; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>All listings <span style="margin-left: auto; background: #0A0A0A; color: #D4AF61; font-size: 12px; padding: 0 8px; border-radius: 999px">{{pendingCount}}</span></a>
<a href="admin-listing-editor.html" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add listing</a>
<a href="admin-dashboard.html#slider" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6"/></svg>Homepage slider</a>
<a href="admin-catalog.html" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 7.5h.01"/></svg>Brands &amp; models</a>
<a href="#" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Enquiries</a>
<a href="#" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Users &amp; roles</a>
<a href="#" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
</nav>
<div style="margin-top: auto; border-top: 1px solid #2B2B2B; padding: 16px 8px 0; display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #1F1F1F; color: #D4AF61; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">AD</span>
<div style="flex: 1; font-size: 13px"><div style="font-weight: 600">Admin user</div><div style="color: #9A9A9A">Administrator</div></div>
<a href="admin-login.html" style="color: #D0D0D0; font-size: 13px; padding: 10px 0">Sign out</a>
</div>
</aside>

<!-- MAIN -->
<main class="prm-up" style="flex: 999 1 640px; min-width: 0; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center">
<div>
<p style="margin: 0; font-size: 13px; color: #666666">Admin / All listings</p>
<h1 style="margin: 2px 0 0; font-family: Saira, sans-serif; font-weight: 800; font-size: 32px; line-height: 1.15; color: #0A0A0A">All listings</h1>
<p style="margin: 4px 0 0; color: #555555; font-size: 14px">Create, edit, approve and feature every advert shown on the website.</p>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<label style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 10px; padding: 0 12px; height: 44px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span style="position: absolute; left: -9999px">Search listings</span><input type="search" placeholder="Search make, model, seller, ref…" style="border: 0; outline: none; width: 240px; background: transparent"></label>
<a href="admin-listing-editor.html" class="prm-btn" style="height: 44px; background: #0A0A0A; color: #D4AF61; font-weight: 600; padding: 0 18px; border-radius: 10px; display: flex; align-items: center">+ Add listing</a>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E6E6E6; border-top: 3px solid #D4AF61; border-radius: 4px; padding: 18px 20px" class="prm-tile"><div style="font-size: 13px; color: #666666; font-weight: 500">Awaiting approval</div><div style="font-family: Saira, sans-serif; font-weight: 800; font-size: 34px; color: #8A5A00">{{pendingCount}}</div></div>
<div style="background: #FFFFFF; border: 1px solid #E6E6E6; border-top: 3px solid #D4AF61; border-radius: 4px; padding: 18px 20px" class="prm-tile"><div style="font-size: 13px; color: #666666; font-weight: 500">Published</div><div style="font-family: Saira, sans-serif; font-weight: 800; font-size: 34px; color: #17663A">{{publishedCount}}</div></div>
<div style="background: #FFFFFF; border: 1px solid #E6E6E6; border-top: 3px solid #D4AF61; border-radius: 4px; padding: 18px 20px" class="prm-tile"><div style="font-size: 13px; color: #666666; font-weight: 500">Rejected</div><div style="font-family: Saira, sans-serif; font-weight: 800; font-size: 34px; color: #A12626">{{rejectedCount}}</div></div>
<div style="background: #FFFFFF; border: 1px solid #E6E6E6; border-top: 3px solid #D4AF61; border-radius: 4px; padding: 18px 20px" class="prm-tile"><div style="font-size: 13px; color: #666666; font-weight: 500">Total listings</div><div style="font-family: Saira, sans-serif; font-weight: 800; font-size: 34px">{{total}}</div></div>
</div>

<section style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 16px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #EFEFEF">
<div role="tablist" aria-label="Filter by status" style="display: flex; flex-wrap: wrap; gap: 4px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><button type="button" role="tab" aria-selected="true" onClick="{{t.pick}}" style="min-height: 40px; padding: 8px 14px; border-radius: 8px; border: 0; background: #0A0A0A; color: #FFFFFF; font-weight: 600; font-size: 14px; cursor: pointer">{{t.label}} <span style="color: #D4AF61">{{t.n}}</span></button></sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}"><button type="button" role="tab" aria-selected="false" onClick="{{t.pick}}" style="min-height: 40px; padding: 8px 14px; border-radius: 8px; border: 0; background: transparent; color: #333333; font-weight: 600; font-size: 14px; cursor: pointer">{{t.label}} <span style="color: #666666">{{t.n}}</span></button></sc-if>
</sc-for>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<label style="font-size: 13px; color: #666666; display: flex; align-items: center; gap: 6px">Brand<select style="height: 40px; border: 1px solid #E6E6E6; border-radius: 8px; padding: 0 10px; background: #FFFFFF"><option>All</option><option>Toyota</option><option>BMW</option><option>Mercedes-Benz</option><option>Nissan</option></select></label>
<label style="font-size: 13px; color: #666666; display: flex; align-items: center; gap: 6px">Body type<select style="height: 40px; border: 1px solid #E6E6E6; border-radius: 8px; padding: 0 10px; background: #FFFFFF"><option>All</option><option>Sedan</option><option>Compact SUV</option><option>Mid-Size SUV</option><option>Full-Size SUV</option></select></label>
</div>
</div>

<div style="overflow-x: auto">
<div role="table" aria-label="Listings" style="min-width: 1120px; font-size: 14px">
<div role="row" class="prm-row" style="display: grid; grid-template-columns: minmax(250px, 2.2fr) minmax(130px, 1.3fr) minmax(110px, 1fr) 70px minmax(90px, 0.9fr) minmax(110px, 1fr) minmax(300px, 1.9fr); align-items: center; background: #FAFAFA; color: #666666; font-size: 12px; font-weight: 600; letter-spacing: 0.04em">
<div role="columnheader" style="padding: 12px 16px">VEHICLE</div>
<div role="columnheader" style="padding: 12px 12px">ADDED BY</div>
<div role="columnheader" style="padding: 12px 12px">SUBMITTED</div>
<div role="columnheader" style="padding: 12px 12px">PHOTOS</div>
<div role="columnheader" style="padding: 12px 12px; text-align: right">PRICE</div>
<div role="columnheader" style="padding: 12px 12px">STATUS</div>
<div role="columnheader" style="padding: 12px 16px; text-align: right">ACTIONS</div>
</div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div role="row" class="prm-row" style="display: grid; grid-template-columns: minmax(250px, 2.2fr) minmax(130px, 1.3fr) minmax(110px, 1fr) 70px minmax(90px, 0.9fr) minmax(110px, 1fr) minmax(300px, 1.9fr); align-items: center; border-top: 1px solid #EFEFEF">
<div role="cell" style="padding: 12px 16px">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 72px; height: 48px; flex: none; border-radius: 8px; background: #161616; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 240 90" width="52" fill="none" stroke="#B8913E" stroke-width="5" stroke-linejoin="round"><path d="M10 62c0-8 6-12 16-14l36-6c14-12 30-20 54-22h34c20 0 36 10 50 22l22 4c8 2 12 8 12 16v4H10z"/></svg></span>
<div><div style="font-weight: 600">{{r.year}} {{r.brand}} {{r.model}}</div><div style="font-size: 12px; color: #666666">{{r.type}} · {{r.ref}}</div></div>
</div>
</div>
<div role="cell" style="padding: 12px"><div>{{r.seller}}</div><div style="font-size: 12px; color: #666666">{{r.sellerType}}</div></div>
<div role="cell" style="padding: 12px; color: #333333">{{r.date}}</div>
<div role="cell" style="padding: 12px; color: #333333">{{r.photos}}</div>
<div role="cell" style="padding: 12px; text-align: right; font-weight: 600">{{r.priceLabel}}</div>
<div role="cell" style="padding: 12px">
<sc-if value="{{r.isPending}}" hint-placeholder-val="{{ true }}"><span style="background: #FFF4D6; color: #7A4F00; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px">● Pending</span></sc-if>
<sc-if value="{{r.isPublished}}" hint-placeholder-val="{{ false }}"><span style="background: #E3F5EA; color: #17663A; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px">● Published</span></sc-if>
<sc-if value="{{r.isRejected}}" hint-placeholder-val="{{ false }}"><span style="background: #FBE5E5; color: #A12626; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px">● Rejected</span></sc-if>
</div>
<div role="cell" style="padding: 12px 16px">
<div style="display: flex; gap: 6px; justify-content: flex-end">
<sc-if value="{{r.canApprove}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{r.approve}}" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 0; background: #17663A; color: #FFFFFF; font-weight: 600; font-size: 13px; cursor: pointer">Approve</button></sc-if>
<sc-if value="{{r.canReject}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{r.reject}}" style="height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid #E8C4C4; background: #FFFFFF; color: #A12626; font-weight: 600; font-size: 13px; cursor: pointer">Reject</button></sc-if>
<sc-if value="{{r.featured}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{r.feature}}" aria-pressed="true" aria-label="Remove {{r.brand}} {{r.model}} from homepage slider" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #D4AF61; background: #FBF3DF; color: #8A6A1F; cursor: pointer; font-size: 16px">★</button></sc-if>
<sc-if value="{{r.notFeatured}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{r.feature}}" aria-pressed="false" aria-label="Feature {{r.brand}} {{r.model}} on homepage" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #E6E6E6; background: #FFFFFF; color: #9A9A9A; cursor: pointer; font-size: 16px">☆</button></sc-if>
<a href="admin-listing-editor.html" aria-label="Edit {{r.brand}} {{r.model}}" style="width: 36px; height: 36px; box-sizing: border-box; border-radius: 8px; border: 1px solid #E6E6E6; background: #FFFFFF; color: #333333; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a>
<button type="button" onClick="{{r.remove}}" aria-label="Delete {{r.brand}} {{r.model}}" style="width: 36px; height: 36px; border-radius: 8px; border: 1px solid #E6E6E6; background: #FFFFFF; color: #A12626; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
</div>
</div>
</div>
</sc-for>
</div>
</div>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 40px; text-align: center; color: #666666">Nothing here — all caught up.</p></sc-if>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-top: 1px solid #EFEFEF; font-size: 13px; color: #666666">
<span>Showing {{shown}} of {{total}}</span>
<span style="display: flex; gap: 6px"><button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #E6E6E6; border-radius: 8px; background: #FFFFFF; cursor: pointer">Previous</button><button type="button" style="height: 36px; padding: 0 12px; border: 1px solid #E6E6E6; border-radius: 8px; background: #FFFFFF; cursor: pointer">Next</button></span>
</div>
</section>

<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}">
<div role="status" class="prm-toast" style="align-self: flex-start; background: #0A0A0A; color: #FFFFFF; border-radius: 10px; padding: 12px 16px; font-size: 14px"><span style="color: #D4AF61; font-weight: 700">✓</span> {{toast}}</div>
</sc-if>
</main>
</div>
</template></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"currency":{"editor":"enum","options":["£","SAR ","$","AED "],"default":"£"},"$preview":{"width":1440,"height":1250}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      tab: 'All', toast: '',
      items: [
        { id: 1, ref: 'PRM-10491', brand: 'Toyota', model: 'Land Cruiser 300', type: 'Full-Size SUV', year: 2023, seller: 'J. Ahmed', sellerType: 'Private seller', date: 'Today, 09:42', photos: 18, price: 74950, status: 'Pending', featured: true },
        { id: 2, ref: 'PRM-10490', brand: 'BMW', model: 'X5 xDrive40i', type: 'Mid-Size SUV', year: 2022, seller: 'S. Patel', sellerType: 'Private seller', date: 'Today, 08:15', photos: 14, price: 52500, status: 'Pending' },
        { id: 3, ref: 'PRM-10488', brand: 'Nissan', model: 'Patrol Platinum', type: 'Full-Size SUV', year: 2021, seller: 'Northgate Cars', sellerType: 'Dealer', date: 'Yesterday', photos: 12, price: 49750, status: 'Pending' },
        { id: 4, ref: 'PRM-10486', brand: 'Mercedes-Benz', model: 'E 300 AMG Line', type: 'Sedan', year: 2023, seller: 'R. Khan', sellerType: 'Private seller', date: 'Yesterday', photos: 16, price: 44995, status: 'Pending' },
        { id: 5, ref: 'PRM-10482', brand: 'Toyota', model: 'RAV4 Hybrid', type: 'Compact SUV', year: 2024, seller: 'Park Road Motors', sellerType: 'In-house stock', date: '1 Nov 2026', photos: 20, price: 33990, status: 'Published', featured: true },
        { id: 6, ref: 'PRM-10479', brand: 'BMW', model: '530e M Sport', type: 'Sedan', year: 2022, seller: 'L. Brown', sellerType: 'Private seller', date: '31 Oct 2026', photos: 15, price: 36450, status: 'Published' },
        { id: 7, ref: 'PRM-10475', brand: 'Nissan', model: 'Qashqai Tekna+', type: 'Compact SUV', year: 2023, seller: 'M. Ali', sellerType: 'Private seller', date: '30 Oct 2026', photos: 3, price: 27450, status: 'Rejected' }
      ]
    };
  }
  renderVals() {
    const cur = this.props.currency ?? '£';
    const s = this.state;
    const set = (id, status, msg) => this.setState({ items: s.items.map((i) => i.id === id ? { ...i, status } : i), toast: msg });
    const count = (st) => s.items.filter((i) => i.status === st).length;
    const tabs = ['All', 'Pending', 'Published', 'Rejected'].map((t) => ({ label: t, n: t === 'All' ? s.items.length : count(t), on: s.tab === t, off: s.tab !== t, pick: () => this.setState({ tab: t }) }));
    const rows = s.items.filter((i) => s.tab === 'All' || i.status === s.tab).map((i) => ({
      ...i, priceLabel: cur + i.price.toLocaleString('en-GB'),
      isPending: i.status === 'Pending', isPublished: i.status === 'Published', isRejected: i.status === 'Rejected',
      featured: !!i.featured, notFeatured: !i.featured,
      feature: () => this.setState({ items: s.items.map((x) => x.id === i.id ? { ...x, featured: !x.featured } : x), toast: i.brand + ' ' + i.model + (i.featured ? ' removed from' : ' added to') + ' homepage slider' }),
      canApprove: i.status !== 'Published', canReject: i.status !== 'Rejected',
      approve: () => set(i.id, 'Published', i.brand + ' ' + i.model + ' approved and published'),
      reject: () => set(i.id, 'Rejected', i.brand + ' ' + i.model + ' rejected — seller notified'),
      remove: () => this.setState({ items: s.items.filter((x) => x.id !== i.id), toast: i.brand + ' ' + i.model + ' deleted' })
    }));
    return {
      tabs, rows, empty: rows.length === 0, shown: rows.length, total: s.items.length,
      pendingCount: count('Pending'), publishedCount: count('Published'), rejectedCount: count('Rejected'),
      toast: s.toast
    };
  }
}
</script>
</body>
</html>
