<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Park Road Motors – Cars for sale</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>x-dc{display:none}</style>
<script src="assets/prm-runtime.js"></script>
</head>
<body>
<x-dc><template>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Saira:wght@600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#8A6A1F;text-decoration:none}a:hover{color:#5E4710}
select,input,button{font:inherit}
@keyframes prmUp{from{opacity:0;transform:translate3d(0,32px,0)}to{opacity:1;transform:none}}
@keyframes prmDown{from{opacity:0;transform:translate3d(0,-100%,0)}to{opacity:1;transform:none}}
@keyframes prmFade{from{opacity:0}to{opacity:1}}
@keyframes prmKen{from{transform:scale(1.02)}to{transform:scale(1.14) translate3d(-1.5%,-1%,0)}}
@keyframes prmTurn{0%,100%{transform:perspective(1200px) rotateY(-12deg)}50%{transform:perspective(1200px) rotateY(12deg)}}
@keyframes prmSpin{to{transform:rotate(360deg)}}
@keyframes prmPulse{0%{transform:scale(.9);opacity:.75}100%{transform:scale(1.7);opacity:0}}
@keyframes prmShine{0%{transform:translate3d(-150%,0,0) skewX(-20deg)}55%,100%{transform:translate3d(380%,0,0) skewX(-20deg)}}
@keyframes prmDrift{0%{transform:scale(1.1) translate3d(-3%,0,0)}100%{transform:scale(1.16) translate3d(3%,-2%,0)}}
@keyframes prmMarquee{to{transform:translate3d(-50%,0,0)}}
@keyframes prmProgress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes prmFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-10px,0)}}
@keyframes prmGlow{0%,100%{opacity:.4}50%{opacity:.85}}
.prm-up{animation:prmUp .9s cubic-bezier(.2,.7,.2,1) both}
.prm-d1{animation-delay:.12s}.prm-d2{animation-delay:.26s}.prm-d3{animation-delay:.4s}.prm-d4{animation-delay:.55s}
.prm-down{animation:prmDown .8s cubic-bezier(.2,.7,.2,1) both}
.prm-swap{animation:prmFade .8s ease both}
.prm-reveal{animation:prmUp .9s cubic-bezier(.2,.7,.2,1) both}
@supports (animation-timeline:view()){.prm-reveal{animation-timeline:view();animation-range:entry 5% cover 25%}}
.prm-ken{position:absolute;inset:0;background:#0A0A0A url(assets/studio.jpg) center/cover no-repeat;animation:prmKen 14s ease-in-out infinite alternate;will-change:transform}
.prm-studio{background:#0A0A0A url(assets/studio.jpg) center/cover no-repeat}
.prm-trails{background:#0A0A0A url(assets/trails.jpg) center/cover no-repeat}
.prm-drift{position:absolute;inset:-8%;background:url(assets/trails.jpg) center/cover no-repeat;animation:prmDrift 26s ease-in-out infinite alternate;will-change:transform}
.prm-carbon{background-color:#0A0A0A;background-image:linear-gradient(180deg,rgba(10,10,10,.5),rgba(10,10,10,.82)),url(assets/carbon.png);background-size:auto,24px 24px}
.prm-pattern{background-color:#FFFFFF;background-image:url(assets/pattern.png);background-size:160px 160px}
.prm-pattern-ivory{background-color:#F7F6F2;background-image:url(assets/pattern.png);background-size:160px 160px}
.prm-turn{animation:prmTurn 9s ease-in-out infinite;transform-origin:50% 80%;will-change:transform}
.prm-float{animation:prmFloat 6s ease-in-out infinite}
.prm-ring{animation:prmSpin 30s linear infinite;transform-origin:50% 50%}
.prm-ring-rev{animation:prmSpin 46s linear infinite reverse;transform-origin:50% 50%}
.prm-glow{animation:prmGlow 4s ease-in-out infinite}
.prm-card{transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s,border-color .5s}
.prm-card:hover{transform:translate3d(0,-10px,0);box-shadow:0 28px 50px -18px rgba(0,0,0,.4);border-color:#D4AF61!important}
.prm-media{position:relative;overflow:hidden}
.prm-img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.prm-card:hover .prm-img{transform:scale(1.1) rotate(-2deg)}
.prm-media::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,236,190,.3),transparent);transform:translate3d(-150%,0,0) skewX(-20deg);pointer-events:none}
.prm-card:hover .prm-media::after{animation:prmShine 1.1s ease-out}
.prm-btn{position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s}
.prm-btn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translate3d(-150%,0,0) skewX(-20deg);animation:prmShine 3.8s ease-in-out infinite;pointer-events:none}
.prm-btn:hover{transform:translate3d(0,-2px,0);box-shadow:0 14px 26px -12px rgba(212,175,97,.8)}
.prm-ghost{transition:background-color .35s,color .35s,border-color .35s}
.prm-ghost:hover{background-color:#D4AF61!important;color:#0A0A0A!important;border-color:#D4AF61!important}
.prm-nav a{position:relative}
.prm-nav a::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:#D4AF61;transform:scaleX(0);transform-origin:right;transition:transform .45s}
.prm-nav a:hover::after{transform:scaleX(1);transform-origin:left}
@media (max-width:720px){.prm-nav{justify-content:center!important;padding:8px 12px!important;gap:0 18px!important}.prm-nav>a{order:-1;flex:1 0 100%!important}.prm-nav>a img{height:28px!important}.prm-nav>div{flex:0 0 auto!important;justify-content:center!important;gap:0 18px!important;font-size:11px}.prm-nav>div a{padding:8px 0!important}}
.prm-brand{transition:transform .45s,border-color .45s,box-shadow .45s}
.prm-brand:hover{transform:translate3d(0,-6px,0);border-color:#D4AF61!important;box-shadow:0 18px 30px -18px rgba(138,106,31,.6)}
.prm-brand:hover .prm-initial{animation:prmSpin 1s cubic-bezier(.2,.7,.2,1)}
.prm-marquee{display:flex;width:max-content;animation:prmMarquee 34s linear infinite}
.prm-marquee:hover{animation-play-state:paused}
.prm-progress{transform-origin:left;animation:prmProgress 6s linear both}
.prm-scrollbar{transform-origin:left;transform:scaleX(0)}
@supports (animation-timeline:scroll()){.prm-scrollbar{animation:prmProgress linear both;animation-timeline:scroll(root)}}
.prm-pulse{animation:prmPulse 2.2s ease-out infinite}
@media (hover:none){.prm-card:hover,.prm-brand:hover{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

input[type=checkbox],input[type=radio]{accent-color:#8A6A1F;width:18px;height:18px;margin:0}
input[type=range]{accent-color:#8A6A1F}
</style>
</helmet>
<div id="page-top" class="prm-pattern" style="color: #0A0A0A; font-family: Montserrat, system-ui, sans-serif; font-size: 15px; line-height: 1.6; min-width: 0">

<header class="prm-down" style="position: sticky; top: 0; z-index: 50; background-color: rgba(10,10,10,0.92); backdrop-filter: blur(12px)">
<nav class="prm-nav" aria-label="Main" style="max-width: 1360px; margin: 0 auto; padding: 12px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em">
<div style="flex: 1 1 260px; display: flex; flex-wrap: wrap; gap: 4px 32px">
<a href="cars-for-sale.html" aria-current="page" style="color: #D4AF61; padding: 12px 0">CARS FOR SALE</a>
<a href="index.html#collections" style="color: #FFFFFF; padding: 12px 0">BRANDS <span aria-hidden="true" style="font-size: 10px; color: #D4AF61">▾</span></a>
</div>
<a href="index.html" aria-label="Park Road Motors home" style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px">
<img src="assets/mark.png" alt="" style="height: 38px; width: auto">
<span style="font-family: Saira, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.12em; color: #D4AF61; line-height: 1">PARK ROAD MOTORS</span>
<span style="font-size: 8px; font-weight: 600; letter-spacing: 0.5em; color: #FFFFFF; line-height: 1">VEHICLE SPECIALISTS</span>
</a>
<div style="flex: 1 1 260px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px 32px">
<a href="index.html#about" style="color: #FFFFFF; padding: 12px 0">ABOUT US</a>
<a href="index.html#contact" style="color: #FFFFFF; padding: 12px 0">CONTACT US</a>
</div>
</nav>
<div aria-hidden="true" style="position: relative; height: 2px; background-color: rgba(212,175,97,0.18)">
<div class="prm-scrollbar" style="position: absolute; inset: 0; background-image: linear-gradient(90deg, #A8822F, #D4AF61, #F0D78F)"></div>
</div>
</header>

<section style="position: relative; overflow: hidden; background-color: #0A0A0A; color: #FFFFFF">
<div aria-hidden="true" class="prm-drift" style="opacity: 0.75"></div>
<div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(90deg, rgba(10,10,10,0.92) 0%, rgba(10,10,10,0.55) 60%, rgba(10,10,10,0.3) 100%)"></div>
<div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 56px 24px 52px">
<p class="prm-up" style="margin: 0; font-size: 12px; letter-spacing: 0.1em; color: #BDBDBD"><a href="index.html" style="color: #BDBDBD">Home</a> / <span style="color: #D4AF61">Cars for sale</span></p>
<h1 class="prm-up prm-d1" style="margin: 10px 0 0; font-weight: 500; font-size: clamp(30px, 4vw, 48px); letter-spacing: 0.08em; line-height: 1.1; color: #FFFFFF">CARS FOR SALE</h1>
<div class="prm-up prm-d2" aria-hidden="true" style="width: 64px; height: 2px; margin-top: 16px; background-image: linear-gradient(90deg, #F0D78F, #D4AF61, #A8822F)"></div>
<p class="prm-up prm-d3" style="margin: 14px 0 0; color: #E6E6E6"><strong style="color: #D4AF61">{{count}}</strong> vehicles match your search</p>
</div>
</section>

<div style="max-width: 1280px; margin: 0 auto; padding: 40px 24px 96px; display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">

<!-- FILTERS -->
<aside aria-label="Filters" class="prm-up prm-d2" style="box-shadow: 0 20px 40px -28px rgba(0,0,0,0.35); border-top: 3px solid #D4AF61 !important; flex: 1 1 280px; max-width: 100%; background: #FFFFFF; border: 1px solid #E4E4E4; border-radius: 2px; padding: 24px; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0; font-family: Saira, sans-serif; font-size: 20px; font-weight: 700">Filters</h2>
<button type="button" onClick="{{reset}}" style="background: none; border: 0; color: #8A6A1F; font-weight: 600; font-size: 14px; cursor: pointer; padding: 10px 0">Reset all</button>
</div>

<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; color: #333333">Keyword
<input type="search" placeholder="e.g. Land Cruiser, M Sport" style="height: 46px; background: #FFFFFF; color: #0A0A0A; border: 1px solid #BDBDBD; border-radius: 2px; padding: 0 14px"></label>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 13px; font-weight: 600; color: #333333; margin-bottom: 10px; padding: 0">Brand</legend>
<sc-for list="{{brandOpts}}" as="b" hint-placeholder-count="5">
<label style="display: flex; align-items: center; gap: 12px; font-size: 15px; min-height: 32px; cursor: pointer">
<input type="checkbox" checked="{{b.checked}}" onChange="{{b.toggle}}">
<span style="flex: 1">{{b.name}}</span><span style="font-size: 13px; color: #666666">{{b.n}}</span>
</label>
</sc-for>
</fieldset>

<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; color: #333333">Model
<select style="height: 46px; background: #FFFFFF; color: #0A0A0A; border: 1px solid #BDBDBD; border-radius: 2px; padding: 0 12px"><option>{{modelHint}}</option></select></label>

<fieldset style="border: 0; margin: 0; padding: 0">
<legend style="font-size: 13px; font-weight: 600; color: #333333; margin-bottom: 10px; padding: 0">Body type</legend>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{typeOpts}}" as="t" hint-placeholder-count="5">
<sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}"><button type="button" aria-pressed="true" onClick="{{t.pick}}" style="min-height: 40px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; background: #0A0A0A; color: #D4AF61; border: 1px solid #0A0A0A">{{t.name}}</button></sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{ true }}"><button type="button" aria-pressed="false" onClick="{{t.pick}}" style="min-height: 40px; padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer; background: #FFFFFF; color: #0A0A0A; border: 1px solid #E4E4E4">{{t.name}}</button></sc-if>
</sc-for>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 8px">
<label for="maxp" style="font-size: 13px; font-weight: 600; color: #333333; display: flex; justify-content: space-between">Max price <span style="color: #8A6A1F">{{maxLabel}}</span></label>
<input id="maxp" type="range" min="20000" max="80000" step="5000" value="{{maxPrice}}" onChange="{{onMax}}" style="width: 100%">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #666666"><span>{{cur}}20k</span><span>{{cur}}80k+</span></div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; color: #333333">Year from
<select style="height: 46px; background: #FFFFFF; color: #0A0A0A; border: 1px solid #BDBDBD; border-radius: 2px; padding: 0 10px"><option>Any</option><option>2018</option><option>2020</option><option>2022</option></select></label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; color: #333333">Year to
<select style="height: 46px; background: #FFFFFF; color: #0A0A0A; border: 1px solid #BDBDBD; border-radius: 2px; padding: 0 10px"><option>Any</option><option>2026</option><option>2024</option><option>2022</option></select></label>
</div>

<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; color: #333333">Max mileage
<select style="height: 46px; background: #FFFFFF; color: #0A0A0A; border: 1px solid #BDBDBD; border-radius: 2px; padding: 0 12px"><option>Any mileage</option><option>Up to 10,000</option><option>Up to 30,000</option><option>Up to 60,000</option></select></label>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 13px; font-weight: 600; color: #333333; margin-bottom: 10px; padding: 0">Fuel type</legend>
<label style="display: flex; align-items: center; gap: 12px; font-size: 15px; min-height: 32px"><input type="checkbox">Petrol</label>
<label style="display: flex; align-items: center; gap: 12px; font-size: 15px; min-height: 32px"><input type="checkbox">Diesel</label>
<label style="display: flex; align-items: center; gap: 12px; font-size: 15px; min-height: 32px"><input type="checkbox">Hybrid / Plug-in</label>
<label style="display: flex; align-items: center; gap: 12px; font-size: 15px; min-height: 32px"><input type="checkbox">Electric</label>
</fieldset>

<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
<legend style="font-size: 13px; font-weight: 600; color: #333333; margin-bottom: 10px; padding: 0">Transmission</legend>
<label style="display: flex; align-items: center; gap: 12px; font-size: 15px; min-height: 32px"><input type="radio" name="gear" checked>Any</label>
<label style="display: flex; align-items: center; gap: 12px; font-size: 15px; min-height: 32px"><input type="radio" name="gear">Automatic</label>
<label style="display: flex; align-items: center; gap: 12px; font-size: 15px; min-height: 32px"><input type="radio" name="gear">Manual</label>
</fieldset>
</aside>

<!-- RESULTS -->
<section aria-label="Results" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between">
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="2">
<button type="button" onClick="{{c.clear}}" aria-label="Remove filter {{c.label}}" style="display: flex; align-items: center; gap: 8px; background: #F3E9CF; border: 1px solid #E2CF9C; color: #6E520F; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 999px; cursor: pointer">{{c.label}} <span aria-hidden="true">✕</span></button>
</sc-for>
<sc-if value="{{noChips}}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #666666; padding: 8px 0">No filters applied</span></sc-if>
</div>
<div style="display: flex; gap: 10px; align-items: center">
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: #555555">Sort
<select style="height: 44px; background: #FFFFFF; color: #0A0A0A; border: 1px solid #BDBDBD; border-radius: 2px; padding: 0 12px"><option>Newest listed</option><option>Price: low to high</option><option>Price: high to low</option><option>Mileage: lowest</option><option>Year: newest</option></select></label>
</div>
</div>

<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<div style="border: 1px dashed #E2CF9C; border-radius: 2px; padding: 64px 24px; text-align: center; color: #555555">
<h3 style="margin: 0 0 8px; font-family: Saira, sans-serif; color: #0A0A0A; font-size: 22px">No cars match these filters</h3>
<p style="margin: 0 0 20px">Try removing a filter or raising your maximum price.</p>
<button type="button" onClick="{{reset}}" style="background: #0A0A0A; color: #D4AF61; border: 0; font-weight: 600; padding: 12px 22px; border-radius: 2px; cursor: pointer">Reset filters</button>
</div>
</sc-if>

<div class="prm-up prm-d3" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px">
<sc-for list="{{results}}" as="car" hint-placeholder-count="6">
<article class="prm-card prm-swap" style="background-color: #FFFFFF; border: 1px solid #E4E4E4; border-radius: 2px; overflow: hidden; display: flex; flex-direction: column">
<div class="prm-media" style="aspect-ratio: 16 / 10">
<div class="prm-img prm-studio" style="position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 9%"><svg aria-hidden="true" viewBox="0 0 240 90" width="72%" fill="#151515" stroke="#D4AF61" stroke-width="1.1" stroke-linejoin="round"><path d="{{car.path}}"/><circle cx="60" cy="72" r="13" fill="#0B0B0B"/><circle cx="184" cy="72" r="13" fill="#0B0B0B"/></svg></div>
<button type="button" aria-label="Save this car" class="prm-ghost" style="z-index: 1; position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(10,10,10,0.75); color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
<span style="position: absolute; z-index: 1; bottom: 12px; left: 12px; background: rgba(10,10,10,0.8); font-size: 12px; padding: 4px 10px; border-radius: 2px; color: #FFFFFF">{{car.photos}} photos</span>
</div>
<div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1">
<div>
<p style="margin: 0 0 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: #555555">{{car.typeLabel}}</p>
<h3 style="margin: 0; font-family: Saira, sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2">{{car.year}} {{car.brand}} {{car.model}}</h3>
<p style="margin: 2px 0 0; font-size: 14px; color: #555555">{{car.trim}}</p>
</div>
<p style="margin: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: #333333">
<span>{{car.miles}} mi</span><span>{{car.fuel}}</span><span>{{car.gear}}</span>
</p>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto; border-top: 1px solid #EDEDED; padding-top: 14px">
<span style="font-family: Saira, sans-serif; font-weight: 700; font-size: 24px; color: #8A6A1F">{{car.priceLabel}}</span>
<a href="car-details.html" style="font-size: 14px; font-weight: 600; padding: 10px 0">Details →</a>
</div>
</div>
</article>
</sc-for>
</div>

<nav aria-label="Pagination" style="display: flex; justify-content: center; gap: 8px; margin-top: 16px">
<a href="#" aria-label="Previous page" style="width: 44px; height: 44px; border: 1px solid #E4E4E4; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #666666">‹</a>
<a href="#" aria-current="page" style="width: 44px; height: 44px; border-radius: 2px; display: flex; align-items: center; justify-content: center; background: #0A0A0A; color: #D4AF61; font-weight: 700">1</a>

<script type="text/x-dc" data-dc-script data-props='{"currency":{"editor":"enum","options":["£","SAR ","$","AED "],"default":"£"},"$preview":{"width":1440,"height":2100}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { brands: [], type: 'All', maxPrice: 80000 }; }
  renderVals() {
    const cur = this.props.currency ?? '£';
    const s = this.state;
    const all = [
      { brand: 'Toyota', model: 'Land Cruiser 300', trim: 'GR Sport · 3.5 V6', type: 'Full-Size SUV', year: 2023, miles: '18,400', fuel: 'Petrol', gear: 'Automatic', price: 74950, photos: 18 },
      { brand: 'BMW', model: 'X5 xDrive40i', trim: 'M Sport', type: 'Mid-Size SUV', year: 2022, miles: '21,000', fuel: 'Petrol', gear: 'Automatic', price: 52500, photos: 14 },
      { brand: 'Mercedes-Benz', model: 'E 300', trim: 'AMG Line Premium', type: 'Sedan', year: 2023, miles: '12,800', fuel: 'Petrol', gear: 'Automatic', price: 44995, photos: 16 },
      { brand: 'Nissan', model: 'Patrol', trim: 'Platinum · 5.6 V8', type: 'Full-Size SUV', year: 2021, miles: '30,500', fuel: 'Petrol', gear: 'Automatic', price: 49750, photos: 12 },
      { brand: 'Toyota', model: 'RAV4 Hybrid', trim: 'Excel · AWD-i', type: 'Compact SUV', year: 2024, miles: '6,200', fuel: 'Hybrid', gear: 'Automatic', price: 33990, photos: 20 },
      { brand: 'BMW', model: '530e', trim: 'M Sport · Plug-in', type: 'Sedan', year: 2022, miles: '19,700', fuel: 'PHEV', gear: 'Automatic', price: 36450, photos: 15 },
      { brand: 'Mercedes-Benz', model: 'GLC 300', trim: '4MATIC AMG Line', type: 'Mid-Size SUV', year: 2023, miles: '9,900', fuel: 'Petrol', gear: 'Automatic', price: 47800, photos: 17 },
      { brand: 'Nissan', model: 'Qashqai', trim: 'Tekna+ e-Power', type: 'Compact SUV', year: 2023, miles: '11,300', fuel: 'Hybrid', gear: 'Automatic', price: 27450, photos: 13 },
      { brand: 'Toyota', model: 'Camry', trim: 'Excel Hybrid', type: 'Sedan', year: 2021, miles: '34,800', fuel: 'Hybrid', gear: 'Automatic', price: 22995, photos: 11 }
    ];
    const PATHS = { 'Sedan': 'M8 70c0-7 5-11 14-12l40-6c16-12 32-20 56-21h26c22 0 38 9 54 21l26 4c8 1 12 6 12 14v6H8z', 'Compact SUV': 'M12 72V56c0-6 4-10 12-11l30-5 22-18c6-4 12-6 20-6h46c14 0 26 6 36 16l20 10c10 3 16 8 16 16v14H12z', 'Mid-Size SUV': 'M8 72V52c0-6 4-9 10-10l30-4 22-20c5-4 11-6 18-6h62c12 0 22 6 30 16l18 12c12 3 18 8 18 16v16H8z', 'Full-Size SUV': 'M6 72V46c0-6 4-8 10-9l26-3 18-20c4-3 9-5 15-5h88c10 0 18 5 24 14l14 14c12 2 20 6 20 14v21H6z' };
    const names = ['Toyota', 'BMW', 'Mercedes-Benz', 'Nissan'];
    const toggle = (n) => this.setState({ brands: s.brands.includes(n) ? s.brands.filter((x) => x !== n) : [...s.brands, n] });
    const brandOpts = names.map((n) => ({ name: n, n: all.filter((c) => c.brand === n).length, checked: s.brands.includes(n), toggle: () => toggle(n) }));
    const typeOpts = ['All', 'Sedan', 'Compact SUV', 'Mid-Size SUV', 'Full-Size SUV'].map((t) => {
      const on = s.type === t;
      return { name: t, on, off: !on, pick: () => this.setState({ type: t }) };
    });
    const results = all.filter((c) => (s.brands.length === 0 || s.brands.includes(c.brand)) && (s.type === 'All' || c.type === s.type) && (s.maxPrice >= 80000 || c.price <= s.maxPrice))
      .map((c) => ({ ...c, path: PATHS[c.type], typeLabel: c.type.toUpperCase(), priceLabel: cur + c.price.toLocaleString('en-GB') }));
    const chips = [
      ...s.brands.map((b) => ({ label: b, clear: () => toggle(b) })),
      ...(s.type !== 'All' ? [{ label: s.type, clear: () => this.setState({ type: 'All' }) }] : []),
      ...(s.maxPrice < 80000 ? [{ label: 'Up to ' + cur + s.maxPrice.toLocaleString('en-GB'), clear: () => this.setState({ maxPrice: 80000 }) }] : [])
    ];
    return {
      cur, brandOpts, typeOpts, results, chips,
      count: results.length, empty: results.length === 0, noChips: chips.length === 0,
      maxPrice: s.maxPrice, maxLabel: s.maxPrice >= 80000 ? 'No max' : cur + s.maxPrice.toLocaleString('en-GB'),
      modelHint: s.brands.length === 1 ? 'Any ' + s.brands[0] + ' model' : s.brands.length ? 'Any model' : 'Select a brand first',
      onMax: (e) => this.setState({ maxPrice: Number(e.target.value) }),
      reset: () => this.setState({ brands: [], type: 'All', maxPrice: 80000 })
    };
  }
}
</script>
