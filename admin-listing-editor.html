<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Park Road Motors – Add / edit listing</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>x-dc{display:none}</style>
<script src="assets/prm-runtime.js"></script>
</head>
<body>
<x-dc><template>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F5}
a{color:#8A6A1F;text-decoration:none}a:hover{color:#5E4710}
input,button,select,textarea{font:inherit}
@keyframes prmUp{from{opacity:0;transform:translate3d(0,32px,0)}to{opacity:1;transform:none}}
@keyframes prmDown{from{opacity:0;transform:translate3d(0,-100%,0)}to{opacity:1;transform:none}}
@keyframes prmFade{from{opacity:0}to{opacity:1}}
@keyframes prmKen{from{transform:scale(1.02)}to{transform:scale(1.14) translate3d(-1.5%,-1%,0)}}
@keyframes prmTurn{0%,100%{transform:perspective(1200px) rotateY(-12deg)}50%{transform:perspective(1200px) rotateY(12deg)}}
@keyframes prmSpin{to{transform:rotate(360deg)}}
@keyframes prmPulse{0%{transform:scale(.9);opacity:.75}100%{transform:scale(1.7);opacity:0}}
@keyframes prmShine{0%{transform:translate3d(-150%,0,0) skewX(-20deg)}55%,100%{transform:translate3d(380%,0,0) skewX(-20deg)}}
@keyframes prmDrift{0%{transform:scale(1.1) translate3d(-3%,0,0)}100%{transform:scale(1.16) translate3d(3%,-2%,0)}}
@keyframes prmMarquee{to{transform:translate3d(-50%,0,0)}}
@keyframes prmProgress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes prmFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-10px,0)}}
@keyframes prmGlow{0%,100%{opacity:.4}50%{opacity:.85}}
.prm-up{animation:prmUp .9s cubic-bezier(.2,.7,.2,1) both}
.prm-d1{animation-delay:.12s}.prm-d2{animation-delay:.26s}.prm-d3{animation-delay:.4s}.prm-d4{animation-delay:.55s}
.prm-down{animation:prmDown .8s cubic-bezier(.2,.7,.2,1) both}
.prm-swap{animation:prmFade .8s ease both}
.prm-reveal{animation:prmUp .9s cubic-bezier(.2,.7,.2,1) both}
@supports (animation-timeline:view()){.prm-reveal{animation-timeline:view();animation-range:entry 5% cover 25%}}
.prm-ken{position:absolute;inset:0;background:#0A0A0A url(assets/studio.jpg) center/cover no-repeat;animation:prmKen 14s ease-in-out infinite alternate;will-change:transform}
.prm-studio{background:#0A0A0A url(assets/studio.jpg) center/cover no-repeat}
.prm-trails{background:#0A0A0A url(assets/trails.jpg) center/cover no-repeat}
.prm-drift{position:absolute;inset:-8%;background:url(assets/trails.jpg) center/cover no-repeat;animation:prmDrift 26s ease-in-out infinite alternate;will-change:transform}
.prm-carbon{background-color:#0A0A0A;background-image:linear-gradient(180deg,rgba(10,10,10,.5),rgba(10,10,10,.82)),url(assets/carbon.png);background-size:auto,24px 24px}
.prm-pattern{background-color:#FFFFFF;background-image:url(assets/pattern.png);background-size:160px 160px}
.prm-pattern-ivory{background-color:#F7F6F2;background-image:url(assets/pattern.png);background-size:160px 160px}
.prm-turn{animation:prmTurn 9s ease-in-out infinite;transform-origin:50% 80%;will-change:transform}
.prm-float{animation:prmFloat 6s ease-in-out infinite}
.prm-ring{animation:prmSpin 30s linear infinite;transform-origin:50% 50%}
.prm-ring-rev{animation:prmSpin 46s linear infinite reverse;transform-origin:50% 50%}
.prm-glow{animation:prmGlow 4s ease-in-out infinite}
.prm-card{transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s,border-color .5s}
.prm-card:hover{transform:translate3d(0,-10px,0);box-shadow:0 28px 50px -18px rgba(0,0,0,.4);border-color:#D4AF61!important}
.prm-media{position:relative;overflow:hidden}
.prm-img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.prm-card:hover .prm-img{transform:scale(1.1) rotate(-2deg)}
.prm-media::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,236,190,.3),transparent);transform:translate3d(-150%,0,0) skewX(-20deg);pointer-events:none}
.prm-card:hover .prm-media::after{animation:prmShine 1.1s ease-out}
.prm-btn{position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s}
.prm-btn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translate3d(-150%,0,0) skewX(-20deg);animation:prmShine 3.8s ease-in-out infinite;pointer-events:none}
.prm-btn:hover{transform:translate3d(0,-2px,0);box-shadow:0 14px 26px -12px rgba(212,175,97,.8)}
.prm-ghost{transition:background-color .35s,color .35s,border-color .35s}
.prm-ghost:hover{background-color:#D4AF61!important;color:#0A0A0A!important;border-color:#D4AF61!important}
.prm-nav a{position:relative}
.prm-nav a::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:#D4AF61;transform:scaleX(0);transform-origin:right;transition:transform .45s}
.prm-nav a:hover::after{transform:scaleX(1);transform-origin:left}
@media (max-width:720px){.prm-nav{justify-content:center!important;padding:8px 12px!important;gap:0 18px!important}.prm-nav>a{order:-1;flex:1 0 100%!important}.prm-nav>a img{height:28px!important}.prm-nav>div{flex:0 0 auto!important;justify-content:center!important;gap:0 18px!important;font-size:11px}.prm-nav>div a{padding:8px 0!important}}
.prm-brand{transition:transform .45s,border-color .45s,box-shadow .45s}
.prm-brand:hover{transform:translate3d(0,-6px,0);border-color:#D4AF61!important;box-shadow:0 18px 30px -18px rgba(138,106,31,.6)}
.prm-brand:hover .prm-initial{animation:prmSpin 1s cubic-bezier(.2,.7,.2,1)}
.prm-marquee{display:flex;width:max-content;animation:prmMarquee 34s linear infinite}
.prm-marquee:hover{animation-play-state:paused}
.prm-progress{transform-origin:left;animation:prmProgress 6s linear both}
.prm-scrollbar{transform-origin:left;transform:scaleX(0)}
@supports (animation-timeline:scroll()){.prm-scrollbar{animation:prmProgress linear both;animation-timeline:scroll(root)}}
.prm-pulse{animation:prmPulse 2.2s ease-out infinite}
@media (hover:none){.prm-card:hover,.prm-brand:hover{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.prm-side a{transition:background-color .3s,color .3s,transform .3s}
.prm-side a:not([aria-current]):hover{background-color:rgba(212,175,97,.12);color:#D4AF61!important;transform:translate3d(4px,0,0)}
.prm-row{transition:background-color .25s}
.prm-row:hover{background-color:#FBF5E6}
.prm-tile{transition:transform .4s,box-shadow .4s}
.prm-tile:hover{transform:translate3d(0,-4px,0);box-shadow:0 16px 30px -18px rgba(0,0,0,.35)}
.prm-toast{animation:prmUp .5s cubic-bezier(.2,.7,.2,1) both}
input[type=checkbox]{accent-color:#8A6A1F;width:18px;height:18px;margin:0}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1900px; background: #F5F5F5; color: #0A0A0A; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5">

<aside class="prm-carbon" style="flex: 1 1 248px; max-width: 100%; color: #FFFFFF; border-right: 2px solid #D4AF61; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<img src="assets/mark.png" alt="" style="height: 34px; width: auto">
<span style="font-family: Saira, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.05em; color: #D4AF61; line-height: 1.05">PARK ROAD<br>MOTORS</span>
</a>
<nav aria-label="Admin" class="prm-side" style="display: flex; flex-direction: column; gap: 2px; font-size: 14px; font-weight: 500">
<a href="admin-dashboard.html" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg>Dashboard</a>
<a href="admin-listings.html" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>All listings <span style="margin-left: auto; background: #0A0A0A; color: #D4AF61; font-size: 12px; padding: 0 8px; border-radius: 999px">{{pendingCount}}</span></a>
<a href="admin-listing-editor.html" aria-current="page" style="color: #0A0A0A; background: linear-gradient(135deg, #F0D78F 0%, #D4AF61 50%, #B8913E 100%); font-weight: 600; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add listing</a>
<a href="admin-dashboard.html#slider" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6"/></svg>Homepage slider</a>
<a href="admin-catalog.html" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 7.5h.01"/></svg>Brands &amp; models</a>
<a href="#" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Enquiries</a>
<a href="#" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Users &amp; roles</a>
<a href="#" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
</nav>
<div style="margin-top: auto; border-top: 1px solid #2B2B2B; padding: 16px 8px 0; display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #1F1F1F; color: #D4AF61; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">AD</span>
<div style="flex: 1; font-size: 13px"><div style="font-weight: 600">Admin user</div><div style="color: #9A9A9A">Administrator</div></div>
<a href="admin-login.html" style="color: #D0D0D0; font-size: 13px; padding: 10px 0">Sign out</a>
</div>
</aside>

<main class="prm-up" style="flex: 999 1 640px; min-width: 0; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center">
<div>
<p style="margin: 0; font-size: 13px; color: #666666"><a href="admin-listings.html" style="color: #666666">All listings</a> / Add listing</p>
<h1 style="margin: 2px 0 0; font-family: Saira, sans-serif; font-weight: 800; font-size: 32px; line-height: 1.15; color: #0A0A0A">Add listing</h1>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<a href="admin-listings.html" style="height: 44px; border: 1px solid #E6E6E6; background: #FFFFFF; color: #0A0A0A; font-weight: 600; padding: 0 16px; border-radius: 8px; display: flex; align-items: center">Cancel</a>
<button type="button" onClick="{{saveDraft}}" style="height: 44px; border: 1px solid #E6E6E6; background: #FFFFFF; font-weight: 600; padding: 0 16px; border-radius: 8px; cursor: pointer">Save draft</button>
<button type="button" class="prm-btn" onClick="{{publish}}" style="height: 44px; border: 0; background: #0A0A0A; color: #D4AF61; font-weight: 700; padding: 0 20px; border-radius: 8px; cursor: pointer">Publish listing</button>
</div>
</div>
<sc-if value="{{toast}}" hint-placeholder-val="{{ false }}"><div role="status" class="prm-toast" style="background: #E3F5EA; border: 1px solid #BFE3CC; color: #17663A; border-radius: 8px; padding: 12px 16px; font-weight: 600">✓ {{toast}}</div></sc-if>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">
<form style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<fieldset style="margin: 0; background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 24px">
<legend style="float: left; width: 100%; padding: 0; margin-bottom: 16px; font-family: Saira, sans-serif; font-weight: 700; font-size: 20px">Vehicle</legend>
<div style="clear: both; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333">Brand *<select style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 10px; background: #FFFFFF"><option>Toyota</option><option>BMW</option><option>Mercedes-Benz</option><option>Nissan</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333">Model *<select style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 10px; background: #FFFFFF"><option>Land Cruiser 300</option><option>RAV4</option><option>Camry</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333">Year *<select style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 10px; background: #FFFFFF"><option>2023</option><option>2022</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333">Body type *<select style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 10px; background: #FFFFFF"><option>Full-Size SUV</option><option>Mid-Size SUV</option><option>Compact SUV</option><option>Sedan</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333; grid-column: 1 / -1">Advert title *<input type="text" value="Toyota Land Cruiser 300 GR Sport 3.5 V6 Twin-Turbo" style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 12px"></label>
</div>
</fieldset>

<fieldset style="margin: 0; background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 24px">
<legend style="float: left; width: 100%; padding: 0; margin-bottom: 16px; font-family: Saira, sans-serif; font-weight: 700; font-size: 20px">Price &amp; specifications</legend>
<div style="clear: both; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333">Price *<input type="text" value="74,950" style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 12px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333">Mileage *<input type="text" value="18,400" style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 12px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333">Fuel *<select style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 10px; background: #FFFFFF"><option>Petrol</option><option>Diesel</option><option>Hybrid</option><option>Plug-in hybrid</option><option>Electric</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333">Transmission *<select style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 10px; background: #FFFFFF"><option>Automatic</option><option>Manual</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333">Engine (cc)<input type="text" value="3445" style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 12px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333">Drivetrain<select style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 10px; background: #FFFFFF"><option>4WD</option><option>AWD</option><option>FWD</option><option>RWD</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333">Colour<input type="text" value="Precious White" style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 12px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #333333">Seats<input type="number" value="7" style="height: 44px; border: 1px solid #CFCFCF; border-radius: 6px; padding: 0 12px"></label>
</div>
</fieldset>

<fieldset style="margin: 0; background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 12px; padding: 24px">
<legend style="float: left; width: 100%; padding: 0; margin-bottom: 4px; font-family: Saira, sans-serif; font-weight: 700; font-size: 20px">Photos</legend>
<p style="clear: both; margin: 0 0 16px; font-size: 13px; color: #666666">Up to 30 photos · JPG/PNG/WebP · the first photo is the cover image. Images are resized automatically for the website.</p>
<div style="border: 2px dashed #D4C59E; border-radius: 10px; padding: 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; background: #FDFAF2; text-align: center">
<svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#8A6A1F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
<p style="margin: 0; font-weight: 600">Drag &amp; drop photos here</p>
<button type="button" onClick="{{add}}" style="height: 40px; padding: 0 16px; border-radius: 6px; border: 0; background: #0A0A0A; color: #D4AF61; font-weight: 600; cursor: pointer">Browse files</button>
</div>
<p style="margin: 16px 0 10px; font-size: 13px; font-weight: 600">{{count}} of 30 uploaded · drag to reorder</p>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px">
<sc-for list="{{photos}}" as="p" hint-placeholder-count="6">
<div style="position: relative; aspect-ratio: 4 / 3; border-radius: 8px; background: radial-gradient(ellipse 70% 60% at 50% 40%, #2A2620 0%, #141416 75%); display: flex; align-items: center; justify-content: center; color: #9A9A9A; font-size: 12px; cursor: grab">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { ids: [1, 2, 3, 4, 5, 6, 7, 8], next: 9, status: 'Draft', toast: '' }; }
  renderVals() {
    const s = this.state;
    return {
      pendingCount: 4,
      photos: s.ids.map((id, i) => ({ n: id, cover: i === 0, remove: () => this.setState({ ids: s.ids.filter((x) => x !== id) }) })),
      count: s.ids.length,
      add: () => { if (s.ids.length < 30) this.setState({ ids: [...s.ids, s.next], next: s.next + 1 }); },
      isDraft: s.status === 'Draft', isPending: s.status === 'Pending', isLive: s.status === 'Published', toast: s.toast,
      saveDraft: () => this.setState({ status: 'Draft', toast: 'Draft saved' }),
      sendForApproval: () => this.setState({ status: 'Pending', toast: 'Sent for approval' }),
      publish: () => this.setState({ status: 'Published', toast: 'Listing published — now live on the website' })
    };
  }
}
</script>
