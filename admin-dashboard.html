<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Park Road Motors – Admin dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>x-dc{display:none}</style>
<script src="assets/prm-runtime.js"></script>
</head>
<body>
<x-dc><template>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F5F5}
a{color:#8A6A1F;text-decoration:none}a:hover{color:#5E4710}
input,button,select{font:inherit}
@keyframes prmUp{from{opacity:0;transform:translate3d(0,32px,0)}to{opacity:1;transform:none}}
@keyframes prmDown{from{opacity:0;transform:translate3d(0,-100%,0)}to{opacity:1;transform:none}}
@keyframes prmFade{from{opacity:0}to{opacity:1}}
@keyframes prmKen{from{transform:scale(1.02)}to{transform:scale(1.14) translate3d(-1.5%,-1%,0)}}
@keyframes prmTurn{0%,100%{transform:perspective(1200px) rotateY(-12deg)}50%{transform:perspective(1200px) rotateY(12deg)}}
@keyframes prmSpin{to{transform:rotate(360deg)}}
@keyframes prmPulse{0%{transform:scale(.9);opacity:.75}100%{transform:scale(1.7);opacity:0}}
@keyframes prmShine{0%{transform:translate3d(-150%,0,0) skewX(-20deg)}55%,100%{transform:translate3d(380%,0,0) skewX(-20deg)}}
@keyframes prmDrift{0%{transform:scale(1.1) translate3d(-3%,0,0)}100%{transform:scale(1.16) translate3d(3%,-2%,0)}}
@keyframes prmMarquee{to{transform:translate3d(-50%,0,0)}}
@keyframes prmProgress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes prmFloat{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-10px,0)}}
@keyframes prmGlow{0%,100%{opacity:.4}50%{opacity:.85}}
.prm-up{animation:prmUp .9s cubic-bezier(.2,.7,.2,1) both}
.prm-d1{animation-delay:.12s}.prm-d2{animation-delay:.26s}.prm-d3{animation-delay:.4s}.prm-d4{animation-delay:.55s}
.prm-down{animation:prmDown .8s cubic-bezier(.2,.7,.2,1) both}
.prm-swap{animation:prmFade .8s ease both}
.prm-reveal{animation:prmUp .9s cubic-bezier(.2,.7,.2,1) both}
@supports (animation-timeline:view()){.prm-reveal{animation-timeline:view();animation-range:entry 5% cover 25%}}
.prm-ken{position:absolute;inset:0;background:#0A0A0A url(assets/studio.jpg) center/cover no-repeat;animation:prmKen 14s ease-in-out infinite alternate;will-change:transform}
.prm-studio{background:#0A0A0A url(assets/studio.jpg) center/cover no-repeat}
.prm-trails{background:#0A0A0A url(assets/trails.jpg) center/cover no-repeat}
.prm-drift{position:absolute;inset:-8%;background:url(assets/trails.jpg) center/cover no-repeat;animation:prmDrift 26s ease-in-out infinite alternate;will-change:transform}
.prm-carbon{background-color:#0A0A0A;background-image:linear-gradient(180deg,rgba(10,10,10,.5),rgba(10,10,10,.82)),url(assets/carbon.png);background-size:auto,24px 24px}
.prm-pattern{background-color:#FFFFFF;background-image:url(assets/pattern.png);background-size:160px 160px}
.prm-pattern-ivory{background-color:#F7F6F2;background-image:url(assets/pattern.png);background-size:160px 160px}
.prm-turn{animation:prmTurn 9s ease-in-out infinite;transform-origin:50% 80%;will-change:transform}
.prm-float{animation:prmFloat 6s ease-in-out infinite}
.prm-ring{animation:prmSpin 30s linear infinite;transform-origin:50% 50%}
.prm-ring-rev{animation:prmSpin 46s linear infinite reverse;transform-origin:50% 50%}
.prm-glow{animation:prmGlow 4s ease-in-out infinite}
.prm-card{transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s,border-color .5s}
.prm-card:hover{transform:translate3d(0,-10px,0);box-shadow:0 28px 50px -18px rgba(0,0,0,.4);border-color:#D4AF61!important}
.prm-media{position:relative;overflow:hidden}
.prm-img{transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.prm-card:hover .prm-img{transform:scale(1.1) rotate(-2deg)}
.prm-media::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:linear-gradient(90deg,transparent,rgba(255,236,190,.3),transparent);transform:translate3d(-150%,0,0) skewX(-20deg);pointer-events:none}
.prm-card:hover .prm-media::after{animation:prmShine 1.1s ease-out}
.prm-btn{position:relative;overflow:hidden;transition:transform .3s,box-shadow .3s}
.prm-btn::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translate3d(-150%,0,0) skewX(-20deg);animation:prmShine 3.8s ease-in-out infinite;pointer-events:none}
.prm-btn:hover{transform:translate3d(0,-2px,0);box-shadow:0 14px 26px -12px rgba(212,175,97,.8)}
.prm-ghost{transition:background-color .35s,color .35s,border-color .35s}
.prm-ghost:hover{background-color:#D4AF61!important;color:#0A0A0A!important;border-color:#D4AF61!important}
.prm-nav a{position:relative}
.prm-nav a::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:#D4AF61;transform:scaleX(0);transform-origin:right;transition:transform .45s}
.prm-nav a:hover::after{transform:scaleX(1);transform-origin:left}
@media (max-width:720px){.prm-nav{justify-content:center!important;padding:8px 12px!important;gap:0 18px!important}.prm-nav>a{order:-1;flex:1 0 100%!important}.prm-nav>a img{height:28px!important}.prm-nav>div{flex:0 0 auto!important;justify-content:center!important;gap:0 18px!important;font-size:11px}.prm-nav>div a{padding:8px 0!important}}
.prm-brand{transition:transform .45s,border-color .45s,box-shadow .45s}
.prm-brand:hover{transform:translate3d(0,-6px,0);border-color:#D4AF61!important;box-shadow:0 18px 30px -18px rgba(138,106,31,.6)}
.prm-brand:hover .prm-initial{animation:prmSpin 1s cubic-bezier(.2,.7,.2,1)}
.prm-marquee{display:flex;width:max-content;animation:prmMarquee 34s linear infinite}
.prm-marquee:hover{animation-play-state:paused}
.prm-progress{transform-origin:left;animation:prmProgress 6s linear both}
.prm-scrollbar{transform-origin:left;transform:scaleX(0)}
@supports (animation-timeline:scroll()){.prm-scrollbar{animation:prmProgress linear both;animation-timeline:scroll(root)}}
.prm-pulse{animation:prmPulse 2.2s ease-out infinite}
@media (hover:none){.prm-card:hover,.prm-brand:hover{transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.prm-side a{transition:background-color .3s,color .3s,transform .3s}
.prm-side a:not([aria-current]):hover{background-color:rgba(212,175,97,.12);color:#D4AF61!important;transform:translate3d(4px,0,0)}
.prm-row{transition:background-color .25s}
.prm-row:hover{background-color:#FBF5E6}
.prm-tile{transition:transform .4s,box-shadow .4s}
.prm-tile:hover{transform:translate3d(0,-4px,0);box-shadow:0 16px 30px -18px rgba(0,0,0,.35)}
.prm-toast{animation:prmUp .5s cubic-bezier(.2,.7,.2,1) both}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1350px; background: #F5F5F5; color: #0A0A0A; font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 1.5">

<aside class="prm-carbon" style="flex: 1 1 248px; max-width: 100%; color: #FFFFFF; border-right: 2px solid #D4AF61; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px">
<a href="index.html" style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<img src="assets/mark.png" alt="" style="height: 34px; width: auto">
<span style="font-family: Saira, sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.05em; color: #D4AF61; line-height: 1.05">PARK ROAD<br>MOTORS</span>
</a>
<nav aria-label="Admin" class="prm-side" style="display: flex; flex-direction: column; gap: 2px; font-size: 14px; font-weight: 500">
<a href="admin-dashboard.html" aria-current="page" style="color: #0A0A0A; background: linear-gradient(135deg, #F0D78F 0%, #D4AF61 50%, #B8913E 100%); font-weight: 600; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/></svg>Dashboard</a>
<a href="admin-listings.html" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>All listings <span style="margin-left: auto; background: #0A0A0A; color: #D4AF61; font-size: 12px; padding: 0 8px; border-radius: 999px">{{pendingCount}}</span></a>
<a href="admin-listing-editor.html" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Add listing</a>
<a href="admin-dashboard.html#slider" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v14H3zM3 15l5-5 4 4 3-3 6 6"/></svg>Homepage slider</a>
<a href="admin-catalog.html" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 7.5h.01"/></svg>Brands &amp; models</a>
<a href="#" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Enquiries</a>
<a href="#" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Users &amp; roles</a>
<a href="#" style="color: #D0D0D0; padding: 10px 12px; border-radius: 6px; display: flex; align-items: center; gap: 12px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
</nav>
<div style="margin-top: auto; border-top: 1px solid #2B2B2B; padding: 16px 8px 0; display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: #1F1F1F; color: #D4AF61; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">AD</span>
<div style="flex: 1; font-size: 13px"><div style="font-weight: 600">Admin user</div><div style="color: #9A9A9A">Administrator</div></div>
<a href="admin-login.html" style="color: #D0D0D0; font-size: 13px; padding: 10px 0">Sign out</a>
</div>
</aside>

<main class="prm-up" style="flex: 999 1 640px; min-width: 0; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center">
<div>
<p style="margin: 0; font-size: 13px; color: #666666">Wednesday, 4 November 2026</p>
<h1 style="margin: 2px 0 0; font-family: Saira, sans-serif; font-weight: 800; font-size: 32px; line-height: 1.15; color: #0A0A0A">Good evening, Admin</h1>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<a href="index.html" style="height: 44px; border: 1px solid #E6E6E6; background: #FFFFFF; color: #0A0A0A; font-weight: 600; padding: 0 16px; border-radius: 8px; display: flex; align-items: center">View website ↗</a>
<a href="admin-listing-editor.html" class="prm-btn" style="height: 44px; background: #0A0A0A; color: #D4AF61; font-weight: 600; padding: 0 18px; border-radius: 8px; display: flex; align-items: center">+ Add listing</a>
</div>
</div>

<!-- KPIs -->
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px">
<div style="background: #FFFFFF; border: 1px solid #E6E6E6; border-top: 3px solid #D4AF61; border-radius: 4px; padding: 18px 20px" class="prm-tile"><div style="font-size: 13px; color: #666666; font-weight: 500">Live adverts</div><div style="font-family: Saira, sans-serif; font-weight: 800; font-size: 34px">{{live}}</div><div style="font-size: 12px; color: #666666">Published on the website</div></div>
<div style="background: #FFFFFF; border: 1px solid #E6E6E6; border-top: 3px solid #D4AF61; border-radius: 4px; padding: 18px 20px" class="prm-tile"><div style="font-size: 13px; color: #666666; font-weight: 500">Awaiting approval</div><div style="font-family: Saira, sans-serif; font-weight: 800; font-size: 34px; color: #7A4F00">{{pendingCount}}</div><a href="admin-listings.html" style="font-size: 12px; font-weight: 600">Review now →</a></div>
<div style="background: #FFFFFF; border: 1px solid #E6E6E6; border-top: 3px solid #D4AF61; border-radius: 4px; padding: 18px 20px" class="prm-tile"><div style="font-size: 13px; color: #666666; font-weight: 500">New enquiries</div><div style="font-family: Saira, sans-serif; font-weight: 800; font-size: 34px">5</div><div style="font-size: 12px; color: #666666">This week (sample)</div></div>
<div style="background: #FFFFFF; border: 1px solid #E6E6E6; border-top: 3px solid #D4AF61; border-radius: 4px; padding: 18px 20px" class="prm-tile"><div style="font-size: 13px; color: #666666; font-weight: 500">Featured on homepage</div><div style="font-family: Saira, sans-serif; font-weight: 800; font-size: 34px">3</div><div style="font-size: 12px; color: #666666">Slider slides</div></div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 20px; align-items: start">

<!-- APPROVAL QUEUE -->
<section aria-label="Approval queue" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 14px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid #EFEFEF">
<h2 style="margin: 0; font-family: Saira, sans-serif; font-weight: 700; font-size: 19px; border-left: 3px solid #D4AF61; padding-left: 10px">Approval queue</h2>
<a href="admin-listings.html" style="font-size: 13px; font-weight: 600; padding: 8px 0">All listings →</a>
</div>
<sc-for list="{{queue}}" as="q" hint-placeholder-count="4">
<div class="prm-row" style="display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid #F2F2F2">
<span aria-hidden="true" style="width: 64px; height: 44px; flex: none; border-radius: 6px; background: #161616; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 240 90" width="46" fill="none" stroke="#B8913E" stroke-width="5" stroke-linejoin="round"><path d="M10 62c0-8 6-12 16-14l36-6c14-12 30-20 54-22h34c20 0 36 10 50 22l22 4c8 2 12 8 12 16v4H10z"/></svg></span>
<div style="flex: 1; min-width: 0"><div style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{q.name}}</div><div style="font-size: 12px; color: #666666">{{q.meta}}</div></div>
<sc-if value="{{q.pending}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{q.approve}}" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 0; background: #17663A; color: #FFFFFF; font-weight: 600; font-size: 13px; cursor: pointer">Approve</button>
<button type="button" onClick="{{q.reject}}" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid #E8C4C4; background: #FFFFFF; color: #A12626; font-weight: 600; font-size: 13px; cursor: pointer">Reject</button>
</sc-if>
<sc-if value="{{q.approved}}" hint-placeholder-val="{{ false }}"><span style="background: #E3F5EA; color: #17663A; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px">● Published</span></sc-if>
<sc-if value="{{q.rejected}}" hint-placeholder-val="{{ false }}"><span style="background: #FBE5E5; color: #A12626; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px">● Rejected</span></sc-if>
</div>
</sc-for>
</section>

<!-- HOMEPAGE SLIDER MANAGER -->
<section id="slider" aria-label="Homepage slider" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 14px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid #EFEFEF">
<h2 style="margin: 0; font-family: Saira, sans-serif; font-weight: 700; font-size: 19px; border-left: 3px solid #D4AF61; padding-left: 10px">Homepage slider</h2>
<button type="button" style="height: 36px; padding: 0 12px; border-radius: 6px; border: 1px solid #E6E6E6; background: #FFFFFF; font-weight: 600; font-size: 13px; cursor: pointer">+ Add slide</button>
</div>
<sc-for list="{{slides}}" as="s" hint-placeholder-count="3">
<div class="prm-row" style="display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid #F2F2F2">
<span style="font-family: Saira, sans-serif; font-weight: 700; color: #9A9A9A; width: 18px">{{s.n}}</span>
<span aria-hidden="true" style="width: 96px; height: 48px; flex: none; border-radius: 6px; background: radial-gradient(ellipse 70% 70% at 50% 40%, #2B2721 0%, #111213 80%); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; box-sizing: border-box"><svg viewBox="0 0 240 90" width="70" fill="#161616" stroke="#B8913E" stroke-width="4" stroke-linejoin="round"><path d="M6 72V46c0-6 4-8 10-9l26-3 18-20c4-3 9-5 15-5h88c10 0 18 5 24 14l14 14c12 2 20 6 20 14v21H6z"/></svg></span>
<div style="flex: 1; min-width: 0"><div style="font-weight: 600">{{s.title}}</div><div style="font-size: 12px; color: #666666">{{s.meta}}</div></div>
<button type="button" onClick="{{s.up}}" aria-label="Move slide {{s.n}} up" style="width: 36px; height: 36px; border-radius: 6px; border: 1px solid #E6E6E6; background: #FFFFFF; cursor: pointer">↑</button>
<button type="button" onClick="{{s.down}}" aria-label="Move slide {{s.n}} down" style="width: 36px; height: 36px; border-radius: 6px; border: 1px solid #E6E6E6; background: #FFFFFF; cursor: pointer">↓</button>
<a href="admin-listing-editor.html" style="font-size: 13px; font-weight: 600; padding: 8px 4px">Edit</a>
</div>
</sc-for>
<p style="margin: 0; padding: 12px 18px; border-top: 1px solid #EFEFEF; font-size: 12px; color: #666666; background: #FAFAFA">Slide image: 2400 × 1200 px JPG. Tick “Show in homepage slider” on any listing to add it here.</p>
</section>

<!-- TOP SELLING -->
<section aria-label="Top-selling section" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 14px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid #EFEFEF">
<h2 style="margin: 0; font-family: Saira, sans-serif; font-weight: 700; font-size: 19px; border-left: 3px solid #D4AF61; padding-left: 10px">Top-selling cars (homepage)</h2>
<span style="font-size: 12px; color: #666666">Shown in this order</span>
</div>
<ol style="margin: 0; padding: 0; list-style: none">
<sc-for list="{{top}}" as="t" hint-placeholder-count="5">
<li class="prm-row" style="display: flex; align-items: center; gap: 12px; padding: 10px 18px; border-top: 1px solid #F2F2F2">
<span style="width: 30px; height: 30px; border-radius: 6px; background: #0A0A0A; color: #D4AF61; font-family: Saira, sans-serif; font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center">{{t.n}}</span>
<span style="flex: 1; font-weight: 600">{{t.name}}</span>
<button type="button" onClick="{{t.up}}" aria-label="Move {{t.name}} up" style="width: 36px; height: 36px; border-radius: 6px; border: 1px solid #E6E6E6; background: #FFFFFF; cursor: pointer">↑</button>
<button type="button" onClick="{{t.remove}}" aria-label="Remove {{t.name}} from top-selling" style="width: 36px; height: 36px; border-radius: 6px; border: 1px solid #E6E6E6; background: #FFFFFF; color: #A12626; cursor: pointer">✕</button>
</li>
</sc-for>
</ol>
</section>

<!-- ENQUIRIES -->
<section aria-label="Recent enquiries" style="background: #FFFFFF; border: 1px solid #E6E6E6; border-radius: 14px; overflow: hidden">
<div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid #EFEFEF">
<h2 style="margin: 0; font-family: Saira, sans-serif; font-weight: 700; font-size: 19px; border-left: 3px solid #D4AF61; padding-left: 10px">Recent enquiries</h2>
<a href="#" style="font-size: 13px; font-weight: 600; padding: 8px 0">View all →</a>
</div>
<sc-for list="{{enquiries}}" as="e" hint-placeholder-count="4">
<div class="prm-row" style="display: flex; gap: 12px; padding: 12px 18px; border-top: 1px solid #F2F2F2">
<span style="width: 36px; height: 36px; flex: none; border-radius: 50%; background: #F2F2F2; color: #333333; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center">{{e.initials}}</span>
<div style="flex: 1; min-width: 0"><div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 600">{{e.name}}</span><span style="font-size: 12px; color: #666666">{{e.when}}</span></div><div style="font-size: 13px; color: #555555">Re: {{e.car}}</div></div>
</div>
</sc-for>
</section>
</div>
</main>
</div>
</template></x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1350}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = {
      queue: [
        { id: 1, name: '2023 Toyota Land Cruiser 300 GR Sport', meta: 'Added today 09:42 · 18 photos', status: 'Pending' },
        { id: 2, name: '2022 BMW X5 xDrive40i M Sport', meta: 'Added today 08:15 · 14 photos', status: 'Pending' },
        { id: 3, name: '2021 Nissan Patrol Platinum', meta: 'Added yesterday · 12 photos', status: 'Pending' },
        { id: 4, name: '2023 Mercedes-Benz E 300 AMG Line', meta: 'Added yesterday · 16 photos', status: 'Pending' }
      ],
      slides: ['Toyota Land Cruiser 300 GR Sport', 'Mercedes-Benz E 300 AMG Line', 'BMW X5 xDrive40i M Sport'],
      top: ['Toyota Land Cruiser 300', 'Nissan Patrol Platinum', 'Toyota RAV4 Hybrid', 'BMW X5 xDrive40i', 'Mercedes-Benz E 300']
    };
  }
  renderVals() {
    const s = this.state;
    const swap = (arr, i, j) => { const a = [...arr]; if (j < 0 || j >= a.length) return a; [a[i], a[j]] = [a[j], a[i]]; return a; };
    const setQ = (id, status) => this.setState({ queue: s.queue.map((q) => q.id === id ? { ...q, status } : q) });
    const pendingCount = s.queue.filter((q) => q.status === 'Pending').length;
    return {
      pendingCount, live: 6 + s.queue.filter((q) => q.status === 'Published').length,
      queue: s.queue.map((q) => ({ ...q, pending: q.status === 'Pending', approved: q.status === 'Published', rejected: q.status === 'Rejected', approve: () => setQ(q.id, 'Published'), reject: () => setQ(q.id, 'Rejected') })),
      slides: s.slides.map((t, i) => ({ n: i + 1, title: t, meta: 'Linked to listing · Live', up: () => this.setState({ slides: swap(s.slides, i, i - 1) }), down: () => this.setState({ slides: swap(s.slides, i, i + 1) }) })),
      top: s.top.map((t, i) => ({ n: i + 1, name: t, up: () => this.setState({ top: swap(s.top, i, i - 1) }), remove: () => this.setState({ top: s.top.filter((_, j) => j !== i) }) })),
      enquiries: [
        { initials: 'AK', name: 'A. Khan', when: '2h ago', car: '2023 Toyota Land Cruiser 300' },
        { initials: 'SM', name: 'S. Malik', when: '5h ago', car: '2022 BMW X5 xDrive40i' },
        { initials: 'JR', name: 'J. Roberts', when: 'Yesterday', car: '2024 Toyota RAV4 Hybrid' },
        { initials: 'HP', name: 'H. Patel', when: 'Yesterday', car: '2023 Mercedes-Benz E 300' }
      ]
    };
  }
}
</script>
</body>
</html>
